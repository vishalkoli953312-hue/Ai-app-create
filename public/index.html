<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Master Engine & Voice Controller</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #080c14; color: #f8fafc; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: auto; background: #111827; padding: 25px; border-radius: 12px; border: 1px solid #1f2937; position: relative; }
        h2 { color: #38bdf8; margin-top: 0; }
        .btn-voice { background: #2563eb; color: white; border: none; padding: 15px 30px; cursor: pointer; border-radius: 8px; font-size: 18px; font-weight: bold; width: 100%; }
        .btn-voice:hover { background: #1d4ed8; }
        .settings-btn { position: absolute; top: 25px; right: 25px; background: #374151; padding: 8px 14px; font-size: 18px; border-radius: 8px; cursor: pointer; border: none; color: #fff; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1f2937; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; border: 1px solid #374151; }
        .modal-content textarea, .modal-content input { width: 100%; padding: 10px; margin-top: 8px; background: #111827; border: 1px solid #374151; color: #fff; border-radius: 6px; box-sizing: border-box; }
        .checkbox-group { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; background: #111827; padding: 10px; border-radius: 6px; }
        .checkbox-group label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        #status { margin-top: 15px; font-weight: bold; color: #f59e0b; font-size: 16px; }
        .preview-box { margin-top: 20px; background: #111827; padding: 15px; border-radius: 8px; border: 1px solid #1f2937; }
        iframe { width: 100%; height: 350px; background: #fff; border: none; border-radius: 6px; margin-top: 10px; }
        pre { background: #030712; padding: 15px; border-radius: 6px; overflow-x: auto; color: #10b981; font-size: 13px; max-height: 200px; }
    </style>
</head>
<body>
    <div class="container">
        <button class="settings-btn" onclick="toggleSettings(true)">⚙️ Settings</button>
        
        <h2>🤖 AI Master Software Manager & App Creator</h2>
        <p>बोलकर नया ऐप बनाएं या मुख्य सॉफ्टवेयर अपडेट करें:</p>
        
        <button class="btn-voice" onclick="startListening()">🎤 Voice Command Shuru Karein</button>
        
        <p id="status">Sthiti: Taiyar hai (Suno aur Command do)</p>

        <div class="preview-box">
            <h3>📱 Live Preview Output:</h3>
            <iframe id="livePreview"></iframe>
        </div>

        <h3>Generated Code:</h3>
        <pre id="output">Yahan Generated Code Dikhayi Dega...</pre>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3>⚙️ Config & Keys</h3>
            
            <label>Gemini API Keys (Comma separated):</label>
            <textarea id="apiKeysInput" rows="3" placeholder="AIzaSy..."></textarea>
            
            <label style="display:block; margin-top:10px;">Select Models (Auto-Switch):</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="modelOption" value="gemini-1.5-flash" checked> gemini-1.5-flash</label>
                <label><input type="checkbox" name="modelOption" value="gemini-1.5-pro" checked> gemini-1.5-pro</label>
            </div>

            <label style="display:block; margin-top:10px;">Cloudinary Upload Preset/Config:</label>
            <input type="text" id="cloudinaryInput" placeholder="Cloudinary preset name">
            
            <button onclick="saveSettings()" style="margin-top: 15px; width: 100%; background: #10b981; padding: 10px; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer;">Save Settings</button>
            <button onclick="toggleSettings(false)" style="margin-top: 8px; width: 100%; background: #ef4444; padding: 10px; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer;">Close</button>
        </div>
    </div>

    <script>
        let memory = [];

        window.onload = function() {
            if(localStorage.getItem('gemini_api_keys')) document.getElementById('apiKeysInput').value = localStorage.getItem('gemini_api_keys');
            if(localStorage.getItem('cloudinary_config')) document.getElementById('cloudinaryInput').value = localStorage.getItem('cloudinary_config');
            const savedModels = JSON.parse(localStorage.getItem('selected_models') || '["gemini-1.5-flash", "gemini-1.5-pro"]');
            document.querySelectorAll('input[name="modelOption"]').forEach(cb => {
                cb.checked = savedModels.includes(cb.value);
            });
        };

        function toggleSettings(show) {
            document.getElementById('settingsModal').style.display = show ? 'flex' : 'none';
        }

        function saveSettings() {
            const keys = document.getElementById('apiKeysInput').value;
            const cloudinary = document.getElementById('cloudinaryInput').value;
            const selectedModels = [];
            document.querySelectorAll('input[name="modelOption"]:checked').forEach(cb => {
                selectedModels.push(cb.value);
            });

            localStorage.setItem('gemini_api_keys', keys);
            localStorage.setItem('cloudinary_config', cloudinary);
            localStorage.setItem('selected_models', JSON.stringify(selectedModels));
            speakText("Settings save ho gayi hain.");
            toggleSettings(false);
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                window.speechSynthesis.speak(utterance);
            }
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Voice Recognition Support Nahi Hai.");
                return;
            }

            const rawKeys = localStorage.getItem('gemini_api_keys') || '';
            const modelsArray = JSON.parse(localStorage.getItem('selected_models') || '["gemini-1.5-flash", "gemini-1.5-pro"]');
            const apiKeysArray = rawKeys.split(',').map(k => k.trim()).filter(k => k.length > 0);

            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            
            recognition.onstart = () => { 
                document.getElementById('status').innerText = "Sun rahe hain... Command dijiye!"; 
                speakText("Sun rahe hain, boliye.");
            };

            recognition.onresult = async (event) => {
                const command = event.results[0][0].transcript;
                document.getElementById('status').innerText = `Command: "${command}". Process ho raha hai...`;
                speakText("Command mil gaya hai, Process ho raha hai.");
                
                // वॉइस कमांड में सॉफ्टवेयर अपडेट या ऐप क्रिएशन डिटेक्ट करना
                let currentMode = "CREATE_APP";
                if(command.toLowerCase().includes("software update") || command.toLowerCase().includes("सॉफ्टवेयर अपडेट")) {
                    currentMode = "SOFTWARE_UPDATE";
                }

                try {
                    const res = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            command, 
                            contextMemory: memory,
                            apiKeys: apiKeysArray,
                            models: modelsArray,
                            mode: currentMode
                        })
                    });
                    
                    const data = await res.json();
                    if(data.success) {
                        document.getElementById('output').innerText = JSON.stringify(data.code, null, 2);
                        memory.push({ command, response: data.code });
                        
                        const codeObj = data.code;
                        let fullHtml = codeObj['index.html'] || '';
                        if (codeObj['style.css']) fullHtml = fullHtml.replace('</head>', `<style>${codeObj['style.css']}</style></head>`);
                        if (codeObj['script.js']) fullHtml = fullHtml.replace('</body>', `<script>${codeObj['script.js']}<\/script></body>`);
                        
                        document.getElementById('livePreview').srcdoc = fullHtml;
                        document.getElementById('status').innerText = "Kaam Pura Ho Gaya!";
                        speakText("Kaam safalpurvak pura ho gaya hai.");
                    } else {
                        document.getElementById('status').innerText = "Error: " + data.error;
                        speakText("Error aa gaya hai.");
                    }
                } catch (err) {
                    document.getElementById('status').innerText = "Connection Error: " + err.message;
                }
            };

            recognition.start();
        }
    </script>
</body>
</html>
