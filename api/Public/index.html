<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice App Creator Hub</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0f19; color: #f8fafc; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); position: relative; }
        h2 { color: #38bdf8; margin-top: 0; }
        button { background: #6366f1; color: white; border: none; padding: 12px 24px; cursor: pointer; border-radius: 6px; font-size: 16px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #4f46e5; }
        .settings-btn { position: absolute; top: 25px; right: 25px; background: #334155; padding: 8px 12px; font-size: 18px; border-radius: 8px; cursor: pointer; border: none; color: #fff; }
        .settings-btn:hover { background: #475569; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; border: 1px solid #334155; }
        .modal-content textarea { width: 100%; padding: 10px; margin-top: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; }
        .close-btn { background: #ef4444; margin-top: 15px; width: 100%; }
        
        #status { margin-top: 15px; font-weight: bold; color: #fbbf24; }
        pre { background: #0f172a; padding: 15px; border-radius: 6px; overflow-x: auto; color: #34d399; font-size: 14px; max-height: 400px; }
    </style>
</head>
<body>
    <div class="container">
        <button class="settings-btn" onclick="toggleSettings(true)">⚙️ Settings</button>
        
        <h2>🎤 AI Voice App Creator & Real Voice Model</h2>
        <p>Button dabayein aur bolkar apna app ya feature banwayein:</p>
        <button onclick="startListening()">Bolna Shuru Karein</button>
        <p id="status">Sthiti: Taiyar hai</p>
        <h3>Generated Code:</h3>
        <pre id="output">Yahan code dikhayi dega...</pre>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3>🔑 Gemini API Keys Settings</h3>
            <p style="font-size: 13px; color: #94a3b8;">Apni multiple API keys comma (,) lagakar dalein taaki error aane par auto switch ho sake:</p>
            <textarea id="apiKeysInput" rows="4" placeholder="AIzaSy..., AIzaSy..."></textarea>
            <button onclick="saveSettings()" style="margin-top: 15px; width: 100%; background: #10b981;">Save Karein</button>
            <button class="close-btn" onclick="toggleSettings(false)">Band Karein</button>
        </div>
    </div>

    <script>
        let memory = [];

        window.onload = function() {
            const savedKeys = localStorage.getItem('gemini_api_keys');
            if(savedKeys) {
                document.getElementById('apiKeysInput').value = savedKeys;
            }
        };

        function toggleSettings(show) {
            document.getElementById('settingsModal').style.display = show ? 'flex' : 'none';
        }

        function saveSettings() {
            const keys = document.getElementById('apiKeysInput').value;
            localStorage.setItem('gemini_api_keys', keys);
            speakText("Settings safalpurvak save ho gayi hain.");
            toggleSettings(false);
        }

        // Real Voice Output (Text to Speech)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN'; // Hindi voice support
                window.speechSynthesis.speak(utterance);
            }
        }

        // Real Voice Input (Speech Recognition)
        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Aapka browser voice recognition support nahi karta hai.");
                return;
            }

            const rawKeys = localStorage.getItem('gemini_api_keys') || '';
            const apiKeysArray = rawKeys.split(',').map(k => k.trim()).filter(k => k.length > 0);

            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            
            recognition.onstart = () => { 
                document.getElementById('status').innerText = "Sun rahe hain... boliye!"; 
            };

            recognition.onresult = async (event) => {
                const command = event.results[0][0].transcript;
                document.getElementById('status').innerText = `Command mila: "${command}". Code ban raha hai...`;
                speakText("Command mil gaya hai, code taiyar ho raha hai.");
                
                try {
                    const res = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            command, 
                            contextMemory: memory,
                            apiKeys: apiKeysArray 
                        })
                    });
                    
                    const data = await res.json();
                    if(data.success) {
                        document.getElementById('output').innerText = JSON.stringify(data.code, null, 2);
                        memory.push({ command, response: data.code });
                        document.getElementById('status').innerText = "Safalpurvak code taiyar ho gaya!";
                        speakText("Aapka application code safalpurvak taiyar ho gaya hai.");
                    } else {
                        document.getElementById('status').innerText = "Error: " + data.error;
                        speakText("Error aa gaya hai, kripya apni API key check karein.");
                    }
                } catch (err) {
                    document.getElementById('status').innerText = "Connection Error: " + err.message;
                }
            };

            recognition.onerror = (event) => {
                document.getElementById('status').innerText = "Voice Error: " + event.error;
            };

            recognition.start();
        }
    </script>
</body>
</html>
